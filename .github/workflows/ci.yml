name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      commit:
        description: "Commit SHA (or branch/tag) to build and deploy"
        required: true
        default: master

env:
  IMAGE: spring-boot-cicd
  STACK: spring-boot-cicd

jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Resolve target ref
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ref=${{ github.event.inputs.commit }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.ref }}

      - name: Resolve image tag
        id: tag
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: docker build -t ${{ env.IMAGE }}:${{ steps.tag.outputs.sha }} -t ${{ env.IMAGE }}:latest .

      - name: Initialize Swarm (idempotent)
        if: github.event_name != 'pull_request'
        run: docker swarm init 2>/dev/null || true

      - name: Deploy stack (zero-downtime rolling update)
        if: github.event_name != 'pull_request'
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.sha }}
        run: docker stack deploy -c docker-stack.yml --resolve-image never ${{ env.STACK }}

      - name: Prune dangling images
        if: always()
        run: docker image prune -f
